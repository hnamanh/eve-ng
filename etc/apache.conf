# vim: syntax=apache ts=4 sw=4 sts=4 sr noet

ServerName unl01.example.com

<IfModule mod_rewrite.c>
	# Logging disabled by default
	# LogLevel mod_rewrite.c:trace2
</IfModule>

<Directory /opt/unetlab/html/>
	Options FollowSymLinks
	AllowOverride All
	Require all granted
</Directory>

<Directory /opt/unetlab/data/Exports/>
	Options FollowSymLinks Indexes
	AllowOverride All
	Require all granted
</Directory>

<Directory /opt/unetlab/data/Logs/>
	Options FollowSymLinks Indexes
	AllowOverride All
	Require all granted
</Directory>

<VirtualHost *:80>
	ServerAdmin webmaster@unl01.example.com
	DocumentRoot /opt/unetlab/html

	ErrorLog /opt/unetlab/data/Logs/error.txt
	CustomLog /opt/unetlab/data/Logs/access.txt combined

	Alias /Exports /opt/unetlab/data/Exports
	Alias /Logs /opt/unetlab/data/Logs

	<Location /html5/>
		Require all granted
		ProxyPass http://127.0.0.1:8080/guacamole/ flushpackets=on
		ProxyPassReverse http://127.0.0.1:8080/guacamole/
	</Location>

	<Location /html5/websocket-tunnel>
		Require all granted
		ProxyPass ws://127.0.0.1:8080/guacamole/websocket-tunnel
		ProxyPassReverse ws://127.0.0.1:8080/guacamole/websocket-tunnel
	</Location>

	# Resolute web console (ported from PNETLab): loopback bridges, token-gated.
	# /vnc/ + /telnet/ -> console_mux.py (WS->TCP relay to the node's console port)
	# /guac/           -> guacamole-lite-server.js (WS->guacd for RDP nodes)
	<Location /vnc/>
		Require all granted
		ProxyPass ws://127.0.0.1:6080/ upgrade=websocket
		ProxyPassReverse ws://127.0.0.1:6080/
	</Location>

	<Location /telnet/>
		Require all granted
		ProxyPass ws://127.0.0.1:8022/ upgrade=websocket
		ProxyPassReverse ws://127.0.0.1:8022/
	</Location>

	<Location /guac/>
		Require all granted
		ProxyPass ws://127.0.0.1:8081/ upgrade=websocket
		ProxyPassReverse ws://127.0.0.1:8081/
	</Location>
</VirtualHost>
